pre-commit:
    parallel: true
    commands:
        format:
            glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs,json,jsonc,css,md,mdx,yml,yaml}'
            run: bunx --no-install oxfmt --check {staged_files}
        lint:
            glob: '*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}'
            run: bunx --no-install oxlint {staged_files}

commit-msg:
    commands:
        commitlint:
            run: bunx --no-install commitlint --edit {1}

pre-push:
    parallel: true
    commands:
        types:
            run: bun run typecheck
        test:
            run: bun run test
