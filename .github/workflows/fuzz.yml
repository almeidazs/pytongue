name: Fuzz

# Heavy property-based and random-source runs with a fresh seed. A failure prints the shrunk
# input and the seed: `PYTONGUE_FUZZ=heavy PYTONGUE_FUZZ_SEED=<seed> bun test <file>` reproduces it.
on:
    schedule:
        - cron: '0 5 * * *'
    workflow_dispatch:

jobs:
    fuzz:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - uses: astral-sh/setup-uv@v5
            - run: bun install --frozen-lockfile
            - name: Fuzz
              env:
                  PYTONGUE_FUZZ: heavy
                  PYTONGUE_FUZZ_SEED: ${{ github.run_id }}
              run: |
                  echo "seed: $PYTONGUE_FUZZ_SEED"
                  bun test tests/engine/properties.test.ts tests/engine/pysource.test.ts tests/e2e/generated.test.ts
